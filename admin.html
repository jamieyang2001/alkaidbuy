<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>營運後台 | 瑤光代購</title><meta name="robots" content="noindex,nofollow" /><link rel="stylesheet" href="styles.css" /></head>
<body data-page="admin">
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">瑤</span><span>瑤光代購</span></a><nav class="nav-links"><a href="admin.html" aria-current="page">營運後台</a><a href="index.html">回到商店</a></nav><button class="secondary-button" id="adminLogout" type="button" hidden>登出</button></header>
  <main class="subpage-main admin-page">
    <section class="subpage-heading"><p class="eyebrow">Operations</p><h1>瑤光代購營運後台</h1><p>訂單、商品、售後與採購彙總集中管理。</p></section>
    <section class="section subpage-section" id="adminLoginPanel"><form class="request-form admin-login-form" id="adminLoginForm"><label class="full">管理密碼<input id="adminPassword" type="password" autocomplete="current-password" required /></label><button class="primary-button form-submit" type="submit">登入後台</button><p class="full login-hint" id="adminMessage"></p></form></section>
    <div id="adminApp" hidden>
      <section class="admin-operations"><div class="orders-heading"><div><p class="eyebrow">Overview</p><h2>營運總覽</h2></div><button class="secondary-button" id="refreshAll" type="button">重新整理</button></div><div class="dashboard-stats" id="dashboardStats"></div><p id="operationMessage" class="login-hint"></p></section>
      <nav class="member-tabs admin-tabs" aria-label="後台功能"><button class="active" data-tab="orders">訂單</button><button data-tab="products">商品管理</button><button data-tab="purchases">總採購清單</button><button data-tab="support">售後案件</button><button data-tab="tools">系統工具</button></nav>
      <section class="orders-panel" data-panel="orders"><div class="orders-heading"><div><p class="eyebrow">Orders</p><h2>訂單管理</h2></div><button class="secondary-button" id="exportOrders" type="button">匯出 CSV</button></div><div class="order-list" id="orderList"></div></section>
      <section class="products-panel" data-panel="products" hidden><div class="orders-heading"><div><p class="eyebrow">Catalog</p><h2>商品管理</h2></div><div class="panel-actions"><input id="productSearchAdmin" type="search" placeholder="搜尋商品" /><select id="productStoreFilter"><option value="">全部店家</option></select><button class="primary-button" id="newProduct" type="button">新增商品</button></div></div><div id="adminCategoryNav" class="category-grid admin-category-nav"></div><div id="adminProductGrid" class="product-grid admin-product-grid"></div></section>
      <section class="orders-panel" data-panel="purchases" hidden><div class="orders-heading"><div><p class="eyebrow">Purchasing</p><h2>總採購清單</h2></div><div class="panel-actions"><select id="purchaseStoreFilter"><option value="">全部店家</option></select><button class="primary-button" id="refreshPurchases" type="button">更新並同步試算表</button></div></div><div class="table-scroll"><table class="admin-table"><thead><tr><th>商品</th><th>店家／類別</th><th>規格</th><th>總數</th><th>訂單</th><th>客人</th></tr></thead><tbody id="purchaseList"></tbody></table></div></section>
      <section class="orders-panel" data-panel="support" hidden><div class="orders-heading"><div><p class="eyebrow">After-sales</p><h2>售後案件</h2></div></div><div class="order-list" id="supportList"></div></section>
      <section class="orders-panel" data-panel="tools" hidden><div class="orders-heading"><div><p class="eyebrow">Tools</p><h2>系統工具</h2></div></div><div class="panel-actions"><button class="secondary-button" id="formatSpreadsheet" type="button">整理試算表格式</button><button class="secondary-button" id="enableBackup" type="button">啟用每日備份</button></div></section>
    </div>
  </main>
  <dialog id="productEditor" class="product-dialog admin-editor"><button class="dialog-close" id="closeEditor" type="button" aria-label="關閉">×</button><form class="request-form" id="productForm"><input id="productId" type="hidden" /><label>商品名稱<input id="productName" required /></label><label>店家<select id="productStore"><option value="matsukiyo">松本清</option><option value="muji">無印良品</option><option value="loft">LOFT</option><option value="yodobashi">友都八喜</option><option value="threecoins">3COINS</option><option value="seven">7-11</option></select></label><label>細分類<input id="productCategory" /></label><label>日幣價格<input id="productYen" type="number" min="1" required /></label><label>重量 g<input id="productWeight" type="number" min="1" required /></label><label>庫存<input id="productStock" type="number" min="0" required /></label><label>規格<input id="productSpec" /></label><label>圖片網址<input id="productImage" type="url" /></label><label>狀態<select id="productStatus"><option>可代購</option><option>需確認寄送</option><option>需確認輸入</option><option>需查庫存</option><option>預購</option><option>售完</option></select></label><label class="full">說明<textarea id="productDescription" rows="4"></textarea></label><button class="primary-button form-submit" type="submit">儲存商品</button></form></dialog>
  <script src="admin-page.js"></script>
</body></html>
