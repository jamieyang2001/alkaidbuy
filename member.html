<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>會員中心 | 瑤光代購</title>
    <meta name="description" content="登入瑤光代購會員中心，查看訂單、購物明細與折價券。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="member">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="瑤光代購首頁"><span class="brand-mark">瑤</span><span>瑤光代購</span></a>
      <nav class="nav-links" aria-label="主要導覽">
        <a href="index.html#products">商品</a><a href="index.html#special">代訂</a><a href="index.html#shipping">運費</a><a href="cart.html">購物車</a>
        <a class="active" href="member.html" aria-current="page">會員</a><a href="index.html#lookup">查詢</a><a href="index.html#faq">FAQ</a>
      </nav>
      <a class="line-button" href="https://lin.ee/NxJLmwO" target="_blank" rel="noreferrer">LINE</a>
    </header>
    <main class="subpage-main">
      <section class="subpage-heading"><p class="eyebrow">Member Center</p><h1>會員中心</h1><p>管理自己的訂單明細、歷史紀錄與會員折價券。</p></section>
      <section class="section member-section subpage-section">
        <div class="member-auth" id="memberAuth">
          <form class="request-form" id="memberRegisterForm">
            <div class="full"><p class="eyebrow">Register</p><h2>申請會員</h2></div>
            <label>姓名<input id="memberRegisterName" type="text" autocomplete="name" required /></label>
            <label>Email<input id="memberRegisterEmail" type="email" autocomplete="email" required /></label>
            <label class="full">密碼<input id="memberRegisterPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
            <button class="primary-button form-submit" type="submit">建立會員帳號</button>
          </form>
          <form class="request-form" id="memberLoginForm">
            <div class="full"><p class="eyebrow">Login</p><h2>會員登入</h2></div>
            <label class="full">Email<input id="memberLoginEmail" type="email" autocomplete="email" required /></label>
            <label class="full">密碼<input id="memberLoginPassword" type="password" autocomplete="current-password" required /></label>
            <button class="primary-button form-submit" type="submit">登入會員中心</button>
          </form>
        </div>
        <p class="member-message" id="memberMessage" role="status"></p>
        <div class="member-dashboard" id="memberDashboard" hidden>
          <div class="member-toolbar"><div><p class="eyebrow">My Account</p><h2 id="memberWelcome">會員您好</h2><p id="memberEmail"></p></div><div class="member-actions"><a class="primary-button" href="cart.html">前往購物車</a><button class="secondary-button" id="memberLogout" type="button">登出</button></div></div>
          <div class="member-stats" id="memberStats"></div>
          <div class="member-tabs" role="tablist"><button class="active" type="button" data-member-tab="orders">訂單</button><button type="button" data-member-tab="favorites">收藏</button><button type="button" data-member-tab="recent">最近瀏覽</button><button type="button" data-member-tab="coupons">折價券</button><button type="button" data-member-tab="addresses">地址簿</button><button type="button" data-member-tab="support">售後申請</button></div>
          <div class="member-tab-panel" data-member-panel="orders"><h2>訂單與購物明細</h2><div id="memberOrderList" class="member-order-list"></div></div>
          <div class="member-tab-panel" data-member-panel="favorites" hidden><h2>我的收藏與通知</h2><div id="memberFavoriteList" class="saved-product-list"></div></div>
          <div class="member-tab-panel" data-member-panel="recent" hidden><h2>最近瀏覽</h2><div id="memberRecentList" class="saved-product-list"></div></div>
          <div class="member-tab-panel" data-member-panel="coupons" hidden><h2>我的折價券</h2><div id="memberCouponList" class="member-coupon-list"></div></div>
          <div class="member-tab-panel" data-member-panel="addresses" hidden><h2>地址簿</h2><form class="request-form address-form" id="addressForm"><input id="addressId" type="hidden" /><label>收件人<input id="addressName" required /></label><label>電話<input id="addressPhone" type="tel" required /></label><label>地址<input id="addressText" required /></label><label>超商門市<input id="addressStore" placeholder="選填" /></label><button class="primary-button form-submit" type="submit">儲存地址</button></form><div id="memberAddressList" class="address-list"></div></div>
          <div class="member-tab-panel" data-member-panel="support" hidden><h2>取消、退款與售後申請</h2><form class="request-form" id="supportForm"><label>訂單編號<input id="supportQuoteId" placeholder="YG-..." /></label><label>申請類型<select id="supportType"><option>取消訂單</option><option>缺貨退款</option><option>退換貨詢問</option><option>商品異常</option><option>其他</option></select></label><label class="full">問題說明<textarea id="supportDetails" rows="5" required></textarea></label><label class="full">照片／附件網址<input id="supportAttachment" type="url" placeholder="可貼 Google Drive 圖片連結（選填）" /></label><button class="primary-button form-submit" type="submit">送出售後申請</button><p class="member-message full" id="supportMessage"></p></form></div>
        </div>
      </section>
    </main>
    <nav class="mobile-tabbar" aria-label="手機快速操作"><a href="index.html#products">商品</a><a href="index.html#special">詢問</a><a href="cart.html">購物車</a><a href="member.html" aria-current="page">會員</a></nav>
    <footer class="site-footer"><span>瑤光代購</span><span>IG @alkaidbuy・alkaidbuy@gmail.com</span></footer>
    <script src="account-pages.js"></script>
    <script src="site-enhancements.js"></script>
  </body>
</html>
